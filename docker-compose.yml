services:
  # Full stack: Express API + built SPA (checkout + Razorpay)
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: blackboxfx-web
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      - PORT=8787
      - NODE_ENV=production
    volumes:
      - bbfx-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - blackboxfx-net

  # Optional local frontend HMR only
  web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: blackboxfx-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    profiles:
      - dev
    networks:
      - blackboxfx-net

volumes:
  bbfx-data:

networks:
  blackboxfx-net:
    driver: bridge
